<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;padding:18px 16px 16px}
.hw{max-width:760px;margin:0 auto}
.brand{font-family:"Libre Baskerville",Georgia,serif;font-size:22px;letter-spacing:.02em;color:#f3e6c9}

main{max-width:760px;margin:0 auto;padding:20px 16px 48px}

.lead{color:var(--muted);margin:0 0 18px}
.notice{background:#fff8e8;border:1px solid #ecd9a8;border-radius:10px;padding:12px 14px;font-size:15px;margin:0 0 18px}
.cards{display:grid;gap:12px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;color:inherit}
a.card b{display:block;font-size:19px;color:var(--navy)}a.card span{color:var(--muted);font-size:15px}
a.card:active,a.card:hover{border-color:var(--brass2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px}
.steps{display:flex;gap:6px;margin:0 0 14px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--brass)}
.stepname{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--brass);font-weight:700;margin:0 0 2px}
h2{font-size:21px;margin:0 0 12px}
.f{margin:0 0 16px}.f label.l{display:block;font-weight:600;margin:0 0 6px}.f label.l em{color:var(--err);font-style:normal}
.f .help{font-size:14px;color:var(--muted);margin:-2px 0 6px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[inputmode],textarea{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid #b9c3cf;border-radius:9px;background:#fff;color:var(--ink)}
textarea{min-height:96px}
input:focus,textarea:focus,button:focus-visible,.opt input:focus-visible+span{outline:3px solid rgba(37,99,201,.35);outline-offset:1px;border-color:var(--focus)}
.opts{display:grid;gap:8px}.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:11px 12px;cursor:pointer;background:#fff}
.opt input{width:20px;height:20px;accent-color:var(--navy);margin:0;flex:none}
.opt:has(input:checked){border-color:var(--navy);background:#eef3f9}
.bad input,.bad textarea,.bad .opt{border-color:var(--err)}.msg{color:var(--err);font-size:14px;margin-top:5px}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
button{font:inherit;font-weight:700;font-size:17px;border-radius:10px;padding:13px 20px;border:0;cursor:pointer;min-height:48px}
.pri{background:var(--navy);color:#fff;flex:1}.sec{background:#e7ecf2;color:var(--navy)}
button[disabled]{opacity:.6}
.save{font-size:14px;color:var(--muted);margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.save a,.linkbtn{color:var(--navy);font-weight:600;background:none;padding:0;min-height:0;font-size:14px;text-decoration:underline}
.lock{display:flex;gap:10px;background:#eef6f1;border:1px solid #cfe5d8;border-radius:10px;padding:12px;font-size:15px;margin:0 0 16px}
.review dt{font-size:14px;color:var(--muted)}.review dd{margin:0 0 10px;font-weight:600;word-break:break-word}
.alert{background:#fdecea;border:1px solid #f3c2bd;color:#7d1a14;border-radius:10px;padding:12px 14px;margin:0 0 14px}
.done{text-align:center;padding:28px 12px}.done .ref{font:700 20px "Source Sans 3";letter-spacing:.04em;background:#f2efe6;border-radius:8px;display:inline-block;padding:6px 12px;margin:8px 0}
footer{max-width:760px;margin:0 auto;padding:0 16px 40px;font-size:13px;color:var(--muted)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.resumebox{display:none;margin-top:10px;font-size:14px}.resumebox input{font-size:15px;padding:9px}
</style></head>

function collect() {
  var frm = $('#frm'); if (!frm) return;
  Array.prototype.forEach.call(frm.elements, function (el) {

function showErrs(list) {

function validate(s) {

}
function next() {
  collect(); var s = STEPS[state.step], errs = validate(s); showErrs(errs); if (errs.length) return;
  if (s.id !== 'review') { save(); state.step++; render(); scrollTo(0, 0); return; }
  clearTimeout(tmr);
  var btn = $('#next'); btn.disabled = true; btn.textContent = 'Submitting…';
  google.script.run.withSuccessHandler(function (r) {
    if (!r.ok) { btn.disabled = false; btn.textContent = 'Submit application'; showErrs((r.errors || []).map(function (m) { return ['', m]; })); return; }
    state.submitted = true; state.dirty = false; clearTimeout(tmr); lsSet('msf_' + APP, ''); var a = CFG.apps[APP];
    $('#main').innerHTML = '<div class="panel done"><h1>Thank you — your application was received.</h1><p>Your reference number:</p><div class="ref">' + esc(r.ref) + '</div><p>Simon Zarour will contact you within one business day. Questions: call or text ' + esc(B.cell) + '.</p><p><a href="' + CFG.base + '">Back to all applications</a></p></div>';
    scrollTo(0, 0);
  }).withFailureHandler(function (e) {
    btn.disabled = false; btn.textContent = 'Try again';
    $('#err').innerHTML = '<div class="alert" role="alert">' + esc(e.message || 'Something went wrong.') + ' Your answers are still here and saved — please tap <b>Try again</b>. If it keeps failing, call or text ' + esc(B.cell) + '.</div>';
  }).submitApp({ app: APP, token: state.token, data: state.data, stamp: STAMP, hp: hpVal() });
}
function start() {
  if (!APP) return landing();
  buildSteps();
  var tok = RESUME || lsGet('msf_' + APP);
  if (!tok) return render();
  $('#main').innerHTML = '<p>Loading your saved application…</p>';
  google.script.run.withSuccessHandler(function (r) {
    if (r && r.ok && r.app === APP) { state.data = r.data; state.token = tok; state.ssnSaved = r.ssnSaved; state.dobSaved = r.dobSaved; lsSet('msf_' + APP, tok); }
    render(); if (r && r.ok) $('#savestat').textContent = 'Welcome back — your saved answers are loaded';
  }).withFailureHandler(function () { render(); }).loadDraft(tok);
}
window.addEventListener('beforeunload', function (e) { if (state.dirty || state.saving) { e.preventDefault(); e.returnValue = ''; } });
start();
</script>
